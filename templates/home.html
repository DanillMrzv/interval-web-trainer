<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Тренажёр</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20100%20100%22%3E%3Ctext%20y%3D%22.9em%22%20font-size%3D%2290%22%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/style.css?v={{ css_version }}">
</head>
<body>
    <div class="wrap">
        <div class="nav">
            <a href="/" class="brand"><span class="brand-icon">🧠</span> тренажёр</a>
            <div class="nav-links">
                <a href="/practice">практика</a>
                <a href="/admin">словарь</a>
                <a href="/stats">статистика</a>
            </div>
        </div>

        <h1>Практика на каждый день</h1>
        <p class="subtitle">Интервальный тренажер<br>ответственный за обучение - ТЫ</p>

        <div class="tabs">
            {% for cat in categories %}
                <a href="/practice?category={{ cat }}">{{ cat }}</a>
            {% endfor %}
        </div>

        <div class="fact-banner">
            <span class="fact-icon">💡</span>
            <p class="fact-text" id="fact-text">{{ fact }}</p>
            <button type="button" class="fact-refresh" id="fact-refresh" title="Другой факт">↻</button>
        </div>
    </div>

    <script>
        (function () {
            var btn = document.getElementById('fact-refresh');
            var text = document.getElementById('fact-text');
            if (!btn || !text) return;
            btn.addEventListener('click', function () {
                btn.disabled = true;
                text.classList.add('fact-text-fading');
                fetch('/api/fact')
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        text.textContent = data.fact;
                    })
                    .catch(function () {})
                    .then(function () {
                        text.classList.remove('fact-text-fading');
                        btn.disabled = false;
                    });
            });
        })();
    </script>
</body>
</html>
